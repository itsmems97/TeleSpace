name: Build Telegram library
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "package.json"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx esbuild src/entry.js --bundle --minify --format=iife --platform=browser --define:global=globalThis --define:process.env.NODE_ENV='"production"' --outfile=dist/tg-lib.js --external:fs --external:net --external:tls --alias:crypto=crypto-browserify --alias:stream=stream-browserify --alias:constants=constants-browserify --alias:path=path-browserify --alias:os=os-browserify --alias:process=process/browser
      - name: Patch browser globals (process, Buffer, require)
        run: |
          python3 - <<'PY'
          import re,sys
          p="dist/tg-lib.js"
          s=open(p).read()
          if 'globalThis.process' in s[:400]:
              print('already patched');sys.exit(0)
          m=re.search(r'([\w$]+)\.Buffer=[\w$]+;\1\.SlowBuffer=',s)
          assert m,'buffer exports not found'
          w=re.search(r'var ([\w$]+)=B\(%s=>\{'%re.escape(m.group(1)),s)
          assert w,'buffer wrapper not found'
          old="throw Error('Dynamic require of \"'+t+'\" is not supported')"
          assert s.count(old)==1,'require stub not found'
          s=s.replace(old,'return {}')
          P='var process=globalThis.process||(globalThis.process={env:{},browser:true,version:"",versions:{},platform:"browser",argv:[],cwd:function(){return"/"},nextTick:function(f){var a=[].slice.call(arguments,1);Promise.resolve().then(function(){f.apply(null,a)})},on:function(){},off:function(){},emit:function(){}});'
          G='Object.defineProperty(globalThis,"Buffer",{configurable:true,get:function(){var b=%s().Buffer;Object.defineProperty(globalThis,"Buffer",{value:b,configurable:true,writable:true});return b}});'%w.group(1)
          assert s.startswith('(()=>{')
          open(p,'w').write('(()=>{'+P+G+s[6:])
          print('patched, buffer wrapper =',w.group(1))
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/tg-lib.js
          git commit -m "Build tg-lib.js" || echo "no changes"
          git push
