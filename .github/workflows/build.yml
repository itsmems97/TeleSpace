name: Build Telegram library
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "package.json"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx esbuild src/entry.js --bundle --minify --format=iife --platform=browser --define:global=globalThis --outfile=dist/tg-lib.js --external:fs --external:path --external:os --external:net --external:tls --external:crypto
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/tg-lib.js
          git commit -m "Build tg-lib.js" || echo "no changes"
          git push