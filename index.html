<body>
<div class="bg"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs>

<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>

<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

<symbol id="video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></symbol>
<symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></symbol>

<symbol id="zip" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v5"/></symbol>

<div id="app"></div>
<div id="live"><div class="in"><div class="s" id="liveT"></div><div class="bar"><i id="liveB" style="width:0"></i></div></div></div>
<nav class="nav"><div id="nav"></div></nav>
<button class="fab" id="fab" aria-label="Upload files"><svg class="i"><use href="#plus"/></svg></button>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="ov" id="ovV" style="z-index:10; background:rgba(0,0,0,0.9); align-items:center;">
  <div id="viewer" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;">
    <button id="closeV" style="position:absolute;top:20px;right:20px;color:#fff;background:rgba(255,255,255,0.2);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;">✕</button>
    <div id="vContent" style="max-width:100%;max-height:90%;display:flex;align-items:center;justify-content:center;"></div>
    <a id="vDownload" download style="margin-top:20px;color:#fff;text-decoration:underline;font-size:16px;">Download</a>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="pickM" multiple accept="image/*,video/*" style="display:none">
<input type="file" id="pickA" multiple style="display:none">
<input type="file" id="pickDir" webkitdirectory directory multiple style="display:none">
<input type="file" id="pickDir2" webkitdirectory directory multiple style="display:none">

<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(((e.filename||"").split("/").pop())+":"+e.lineno+" "+e.message)})</script>
<script src="config.js"></script>
<script src="dist/tg-lib.js"></script>
<script src="tg-bridge.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>

</html>
