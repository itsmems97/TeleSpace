<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iSpace</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iSpace">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="device-container">
  <div id="app" class="main-content"></div>
  <div id="live"><div class="in"><div class="s" id="liveT"></div><div class="bar"><i id="liveB" style="width:0"></i></div></div></div>
  <nav id="nav" class="bottom-nav"></nav>
  <button class="fab" id="fab" aria-label="Upload files"><i class="fa-solid fa-plus"></i></button>
</div>

<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="ov" id="ovV" style="z-index:10; background:rgba(0,0,0,0.9); align-items:center;">
  <div id="viewer" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;">
    <button id="closeV" style="position:absolute;top:20px;right:20px;color:#fff;background:rgba(255,255,255,0.2);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;">&times;</button>
    <div id="vContent" style="max-width:100%;max-height:90%;display:flex;align-items:center;justify-content:center;"></div>
<a id="vDownload" download style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);padding:12px 24px;border-radius:30px;color:#fff;text-decoration:none;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-download"></i> Download</a>
  </div>
</div>
<iframe id="land" src="land.html" title="iSpace"></iframe>
<div id="toast"></div>
<input type="file" id="pickM" multiple accept="image/*,video/*" style="display:none">
<input type="file" id="pickA" multiple style="display:none">
<input type="file" id="pickDir" webkitdirectory directory multiple style="display:none">
<input type="file" id="pickDir2" webkitdirectory directory multiple style="display:none">

<script>window.__errs=[];window.addEventListener("error",function(e){window.__errs.push(((e.filename||"").split("/").pop())+":"+e.lineno+" "+e.message)})</script>
<script src="pwa.js"></script>
<script src="config.js"></script>
<script src="dist/tg-lib.js"></script>
<script src="tg-bridge.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
</body>
</html>
